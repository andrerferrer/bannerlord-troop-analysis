name: Phase 2 Westerling hotfix
on:
  push:
    branches:
      - fix/phase2-westerling-reproducibility
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase2-westerling-reproducibility
      - name: Patch stale Phase 2 generator text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, re

          root = Path('.')
          batch = root / 'data/combat_observations/2026-09-05-to-06-rot-westerling-field-followup'
          gen = batch / 'analysis/generate_phase2.py'
          s = gen.read_text(encoding='utf-8')

          s = s.replace('Generate Phase 2 analysis for the White Harbor/Joffrey ROT batch.', 'Generate Phase 2 analysis for the Westerling/Joffrey field follow-up batch.')

          new_report = r'''def report(rankings,reliable,insufficient,focus,pressure,identity_audit):
    current = next(r for r in focus if r['display_name']=='Westerling Hedgeknight' and r['cohort']=='westerling')
    bridge = next(r for r in focus if r['display_name']=='Westerling Hedgeknight' and r['cohort']=='joffrey')
    prior_kills, prior_deployed = 233, 73
    prior_eff = prior_kills / prior_deployed
    prior_kill_share, prior_dep_share = 0.057432, 0.042590
    prior_ratio, prior_retention = 1.348462, 0.452055
    current_eff = float(current['kills_per_deployed'])
    lines=[f'# Phase 2 analysis — {BATCH_ID}','','## Result','',
        f"**Westerling Hedgeknight SURVIVES share/deployment adjustment in the isolated Westerling follow-up.** The current sample is **{current['independent_battles']} independent field battles / {current['deployed']} deployed / {current['kills']} kills = {current_eff:.3f} kills/deployed**. Its kill share is **{100*float(current['player_side_kill_share']):.2f}%** versus **{100*float(current['player_side_deployment_share']):.2f}%** deployment share, for an offensive contribution ratio of **{float(current['offensive_contribution_ratio']):.3f}×**. Retention is **{100*float(current['retention_rate']):.1f}%**. Evidence gate: `{current['reliability_status']}`.",'',
        f'The earlier mixed Joffrey field evidence was **5 battles / {prior_deployed} deployed / {prior_kills} kills = {prior_eff:.3f} kills/deployed**, with **{100*prior_kill_share:.2f}% kill share vs {100*prior_dep_share:.2f}% deployment share = {prior_ratio:.3f}× contribution ratio** and {100*prior_retention:.1f}% retention. The two campaign cohorts are reported side by side but are **not pooled**; differences are descriptive, not causal.','',
        f"Current Joffrey bridge evidence is kept separate: **{bridge['independent_battles']} battles / {bridge['deployed']} deployed / {float(bridge['kills_per_deployed']):.3f} kills/deployed / gate {bridge['reliability_status']}**.",'',
        '## Batch-wide coverage','',
        f'The Phase 2 partition contains **{len(rankings)} troop/cohort rows**: **{len(reliable)} reliable** and **{len(insufficient)} insufficient-evidence** under the 5-independent-battle / 20-deployed gate. All **217** fully visible player-side ordinary-troop occurrences are represented. All retained battles are field battles; player/enemy and Westerling/Joffrey cohort boundaries remain intact.','',
        '## Interpretation','',
        f'Relative to the prior {prior_eff:.3f} kills/deployed mixed sample, the isolated follow-up changes by **{current_eff-prior_eff:.3f} kills/deployed** ({current_eff/prior_eff:.3f}× the prior rate). Because opponent mix, battle size, map and supporting roster differ, this is not treated as a controlled effect estimate.','',
        'The decisive test is share adjustment: a unit that simply occupies more of the army should take a similar share of kills. Here the current Hedgeknight kill share is materially above its deployment share, so the disproportionate offensive signal survives in this cohort.','',
        '## Review and identities','',
        'The six clipped/obscured Phase 1 rows remain unresolved and excluded from primary rankings. No missing number was inferred. Canonical identity decisions are additive in `review/phase2_identity_decisions.csv`; Phase 1 files are unchanged.','',
        f"The committed ROT audit confirms **{sum(r['resolution_status']=='confirmed_id' for r in identity_audit)} of {len(identity_audit)}** observed labels by one exact name-to-ID match. Unresolved labels remain provisional.",'',
        '## Defensive/role boundary','',
        '`battle_pressure_margin.csv` remains a battle-level diagnostic and is not assigned to an individual troop. `role_adjusted_view.csv` groups reliable rows by canonical role but deliberately publishes no blended offense/defense score, matching current repository methodology.','',
        '## Next test','',
        'Test **Cerwyn Marauder** next in the Westerling field cohort. Current coverage is **5 battles / 19 deployed / 1.737 kills/deployed**. The smallest gate-closing addition is at least **1 additional deployed** overall; a dedicated sample is preferable to validate whether the rate survives isolation.','',
        '## Limits','',
        'Campaign observations remain confounded by opponent, roster, map, battle size and player orders. No off-screen row is inferred; Joffrey bridge battles are not pooled with Gawen Westerling battles; no frozen theoretical model is changed.','']
    return '\n'.join(lines)
'''
          s, n = re.subn(r'def report\(rankings,reliable,insufficient,focus,pressure,identity_audit\):.*?\n\ndef main\(\):', new_report + '\n\ndef main():', s, flags=re.S)
          if n != 1:
              raise SystemExit(f'report replacement count={n}')

          old_compat = "write_json(ANALYSIS_DIR/'cohort_compatibility.json',{'status':'passed_with_separate_cohorts_and_contexts','decisions':[{'cohort':'white_harbor','contexts':['field'],'decision':'aggregate only inside field and Wyman Manderly player-party scope'},{'cohort':'joffrey','contexts':['field','siege_attack','siege_defense'],'decision':'same party may aggregate only within one context; contexts never pooled'},{'pair':['white_harbor','joffrey'],'decision':'incompatible campaigns/rosters; never pooled'},{'battle_states':['active_last_readable','phase_complete'],'decision':'independent observations; active remains censored, phase-complete retreat stays its own result category'}]})"
          new_compat = "write_json(ANALYSIS_DIR/'cohort_compatibility.json',{'status':'passed_with_separate_cohorts','decisions':[{'cohort':'westerling','context':'field','decision':'aggregate only inside Gawen Westerling player-party field scope'},{'cohort':'joffrey','context':'field','decision':'bridge battles retained as separate descriptive evidence; never pooled with Westerling cohort'},{'comparison':'prior_pr91_joffrey_field','decision':'side-by-side historical comparison only; no pooled estimator'}]})"
          if old_compat not in s:
              raise SystemExit('old cohort compatibility writer not found')
          s = s.replace(old_compat, new_compat)

          s, n = re.subn(r"\(ANALYSIS_DIR/'NEXT_TEST_RECOMMENDATION\.md'\)\.write_text\(.*?encoding='utf-8'\)", "(ANALYSIS_DIR/'NEXT_TEST_RECOMMENDATION.md').write_text('# Smallest next test\\n\\nTest **Cerwyn Marauder** next in the Westerling field cohort.\\n\\nCurrent coverage: **5 battles / 19 deployed**, at **1.737 kills/deployed**. The smallest gate-closing addition is **0 more independent battle(s)** and at least **1 additional deployed** overall. Keep support roster/orders stable and do not pool Joffrey bridge battles.\\n',encoding='utf-8')", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'next-test replacement count={n}')

          s, n = re.subn(r"\(ANALYSIS_DIR/'README\.md'\)\.write_text\(f.*?encoding='utf-8'\)", "(ANALYSIS_DIR/'README.md').write_text(f\"# Phase 2 analytical outputs\\n\\nAll 217 primary ordinary-troop occurrences partition into {len(rankings)} cohort rows: {len(reliable)} reliable and {len(insufficient)} below gate. Rankings keep efficiency and share-adjusted impact independent. Westerling and Joffrey are separate field-only cohorts and are never pooled.\\n\\nReproduce from the repository root with:\\n\\n```bash\\npython3 {Path(__file__).relative_to(REPO_ROOT).as_posix()}\\n```\\n\\nAdd `--source-zip /absolute/path/to/source.zip` for optional raw-source/member hash verification.\\n\",encoding='utf-8')", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'readme-writer replacement count={n}')

          gen.write_text(s, encoding='utf-8')

          (batch/'analysis/README.md').write_text(
              '# Phase 2 analytical outputs\n\n'
              'All 217 primary ordinary-troop occurrences partition into 57 cohort rows: 10 reliable and 47 below gate. Rankings keep efficiency and share-adjusted impact independent. Westerling and Joffrey are separate field-only cohorts and are never pooled.\n\n'
              'Reproduce from the repository root with:\n\n'
              '```bash\npython3 data/combat_observations/2026-09-05-to-06-rot-westerling-field-followup/analysis/generate_phase2.py\n```\n\n'
              'Add `--source-zip /absolute/path/to/source.zip` for optional raw-source/member hash verification.\n',
              encoding='utf-8')

          # Refresh artifact hashes after the reproducibility-only corrections.
          analysis = batch/'analysis'
          review = batch/'review'
          targets = [p for p in analysis.iterdir() if p.is_file() and p.name != 'artifact_hashes.csv'] + [review/'README.md', review/'review_decisions.csv', review/'phase2_identity_decisions.csv', review/'phase2_review_summary.json']
          rows=[]
          for p in sorted(targets):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append((p.relative_to(batch).as_posix(), h, p.stat().st_size))
          with (analysis/'artifact_hashes.csv').open('w', newline='', encoding='utf-8') as f:
              w=csv.writer(f, lineterminator='\n'); w.writerow(['path','sha256','size_bytes']); w.writerows(rows)
          PY
          python -m py_compile data/combat_observations/2026-09-05-to-06-rot-westerling-field-followup/analysis/generate_phase2.py
          git config user.name 'Andre R Ferrer'
          git config user.email '45776359+andrerferrer@users.noreply.github.com'
          git add data/combat_observations/2026-09-05-to-06-rot-westerling-field-followup
          git commit -m 'fix: make Westerling phase 2 reproducible'
          git rm .github/workflows/phase2-westerling-hotfix.yml
          git commit -m 'chore: remove temporary hotfix workflow'
          git push origin HEAD:fix/phase2-westerling-reproducibility
