name: Weapon-first gauntlet
on:
  push:
    branches: [analysis/weapon-first-gauntlet-2026-09-17]
    paths:
      - .github/workflows/weapon-first-gauntlet.yml
      - scripts/analysis/weapon_first_*.py
      - tests/test_weapon_first_*.py
permissions:
  contents: write
concurrency:
  group: weapon-first-gauntlet-105
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact task commit
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = 'andrerferrer/bannerlord-troop-analysis'
          test "$GITHUB_REF_NAME" = 'analysis/weapon-first-gauntlet-2026-09-17'
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$GITHUB_SHA" 9311f5596aabc04974d5fe4d7113f1088454143f
          git checkout --detach "$GITHUB_SHA"
      - name: Prepare source-only offline Git transport
        run: |
          git bundle create /tmp/bannerlord-weapon-first.bundle HEAD
          sha256sum /tmp/bannerlord-weapon-first.bundle > /tmp/bannerlord-weapon-first.bundle.sha256
      - name: Retain offline transport for this execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          name: weapon-first-source-${{ github.sha }}
          path: /tmp/bannerlord-weapon-first.bundle*
          retention-days: 3
          if-no-files-found: error
      - name: Inspect complete pinned data and run available gauntlet
        run: |
          set -eu
          python3 scripts/analysis/weapon_first_inventory.py
          if test -f scripts/analysis/weapon_first_audit.py; then
            python3 -m unittest discover -s tests -p 'test_weapon_first_*.py' -v
            python3 scripts/analysis/weapon_first_audit.py --repo . --output analysis/weapon_first/2026-09-17
          fi
      - name: Publish only audit outputs on this task branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- analysis/weapon_first/2026-09-17
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'analysis: publish reproducible weapon audit output'
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/analysis/weapon-first-gauntlet-2026-09-17
